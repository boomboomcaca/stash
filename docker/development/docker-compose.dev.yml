# Stash 开发/调试用 Docker Compose 配置
# 使用方法:
#   1. 构建镜像: docker-compose -f docker-compose.dev.yml build
#   2. 启动容器: docker-compose -f docker-compose.dev.yml up -d
#   3. 进入容器: docker-compose -f docker-compose.dev.yml exec stash-dev bash
#   4. 在容器内运行开发命令

services:
  stash-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stash-dev
    stdin_open: true
    tty: true
    ports:
      # Stash 主服务端口
      - "9999:9999"
      # UI 开发服务器端口
      - "3000:3000"
      # Delve 调试器端口
      - "2345:2345"
    volumes:
      # 挂载源代码目录
      - ../..:/stash
      # 持久化 Go 模块缓存
      - go-mod-cache:/go/pkg/mod
      # 持久化 Go 构建缓存
      - go-build-cache:/root/.cache/go-build
      # 持久化 pnpm 缓存
      - pnpm-cache:/root/.local/share/pnpm
      # 开发数据目录
      - ./dev-data:/root/.stash
      # 测试媒体文件目录 (按需修改)
      - ./test-media:/data
    environment:
      - STASH_CONFIG_FILE=/root/.stash/config.yml
      - STASH_STASH=/data/
      - STASH_PORT=9999
      # UI 开发服务器连接后端的地址
      - VITE_APP_PLATFORM_URL=http://localhost:9999
    working_dir: /stash
    # 保持容器运行
    command: tail -f /dev/null

volumes:
  go-mod-cache:
  go-build-cache:
  pnpm-cache:
