type SubtitleConfig {
  whisper_url: String!
  enabled: Boolean!
  auto_generate: Boolean!
  default_language: String!
  skip_if_exists: Boolean!
  timeout: Int!
}

input SubtitleConfigInput {
  whisper_url: String
  enabled: Boolean
  auto_generate: Boolean
  default_language: String
  skip_if_exists: Boolean
  timeout: Int
}

type GenerateSubtitleResult {
  success: Boolean!
  subtitle_path: String
  language: String
  message: String
}

extend type Mutation {
  """Generate subtitle for a single scene"""
  generateSubtitle(scene_id: ID!, language: String): GenerateSubtitleResult!

  """Generate subtitles for multiple scenes (returns job ID)"""
  generateSubtitles(scene_ids: [ID!]!, language: String): ID!

  """Generate subtitles for all scenes without subtitles (returns job ID)"""
  autoGenerateSubtitles(language: String): ID!

  """Configure subtitle settings"""
  configureSubtitle(input: SubtitleConfigInput!): SubtitleConfig!
}

extend type Query {
  """Get subtitle configuration"""
  subtitleConfig: SubtitleConfig!

  """Test connection to Whisper service"""
  testSubtitleConnection: Boolean!
}
