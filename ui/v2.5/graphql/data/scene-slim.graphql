fragment SlimSceneData on Scene {
  id
  title
  code
  details
  director
  urls
  date
  production_date
  rating100
  o_counter
  organized
  interactive
  interactive_speed
  captions {
    language_code
    caption_type
  }
  resume_time
  play_duration
  play_count

  files {
    id
    path
    size
    mod_time
    duration
    video_codec
    audio_codec
    width
    height
    frame_rate
    bit_rate
    fingerprints {
      type
      value
    }
  }

  paths {
    screenshot
    preview
    stream
    webp
    vtt
    sprite
    funscript
    interactive_heatmap
    caption
  }

  scene_markers {
    id
    title
    seconds
    primary_tag {
      id
      name
    }
  }

  galleries {
    id
    title
  }

  studio {
    id
    name
    image_path
  }

  groups {
    group {
      id
      name
      front_image_path
    }
    scene_index
  }

  tags {
    id
    name
  }

  performers {
    id
    name
    image_path
  }

  stash_ids {
    endpoint
    stash_id
    updated_at
  }
}
