fragment UltraSlimSceneData on Scene {
  id
  title
  code
  details
  director
  urls
  date
  rating100
  o_counter
  organized
  interactive
  interactive_speed
  resume_time
  play_duration
  play_count

  # 简化的文件数据 - 只传输列表需要的字段
  files {
    id
    path
    size
    mod_time
    duration
    width
    height
  }

  # 只传输路径
  paths {
    screenshot
    preview
    stream
    webp
    vtt
    sprite
    funscript
    interactive_heatmap
    caption
  }

  # 简化的场景标记 - 只传输必要字段
  scene_markers {
    id
    title
    seconds
    primary_tag {
      id
      name
    }
  }

  # 简化的画廊 - 只传输ID和标题
  galleries {
    id
    title
  }

  # 简化的工作室 - 只传输基本字段
  studio {
    id
    name
  }

  # 简化的组 - 只传输必要字段
  groups {
    group {
      id
      name
      front_image_path
    }
    scene_index
  }

  # 简化的标签 - 只传输ID和名称
  tags {
    id
    name
  }

  # 简化的表演者 - 只传输基本字段
  performers {
    id
    name
    image_path
  }

  stash_ids {
    endpoint
    stash_id
    updated_at
  }
}
